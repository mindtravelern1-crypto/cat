<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵咪TI</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #E8524A;
    --coral-light: #F07068;
    --coral-pale: #FDECEA;
    --peach: #F5C5A3;
    --sky: #6BB8D4;
    --sky-light: #D4EBF5;
    --sky-pale: #EDF6FB;
    --orange: #F5A350;
    --cream: #FDF6F0;
    --brown: #5C3D2E;
    --brown-light: #8B6355;
    --white: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--cream);
    min-height: 100vh;
    overflow-x: hidden;
    color-scheme: light;
    -webkit-text-size-adjust: 100%;
  }

  #result {
    background: var(--cream);
  }

  #splash {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    background: linear-gradient(160deg, #FDF0E8 0%, #F5E6D8 50%, #EDD5C5 100%);
    position: relative;
    overflow: hidden;
  }

  #splash::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(232,82,74,0.12) 0%, transparent 70%);
    border-radius: 50%;
  }

  #splash::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 220px; height: 220px;
    background: radial-gradient(circle, rgba(168,212,230,0.2) 0%, transparent 70%);
    border-radius: 50%;
  }

  .splash-cat {
    font-size: 88px;
    margin-bottom: 8px;
    animation: floatCat 3s ease-in-out infinite;
    filter: drop-shadow(0 8px 16px rgba(92,61,46,0.15));
  }

  @keyframes floatCat {
    0%, 100% { transform: translateY(0px) rotate(-3deg); }
    50% { transform: translateY(-12px) rotate(3deg); }
  }

  .splash-badge {
    background: var(--coral);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 1px;
    margin-bottom: 20px;
  }

  .splash-title {
    font-size: 32px;
    font-weight: 900;
    color: var(--brown);
    text-align: center;
    line-height: 1.3;
    margin-bottom: 12px;
  }

  .splash-title span { color: var(--coral); }

  .splash-sub {
    font-size: 14px;
    color: var(--brown-light);
    text-align: center;
    line-height: 1.7;
    margin-bottom: 36px;
    max-width: 280px;
  }

  .btn-start {
    background: var(--coral);
    color: white;
    border: none;
    padding: 16px 48px;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(232,82,74,0.35);
    transition: all 0.2s;
    position: relative;
    z-index: 1;
  }

  .btn-start:active { transform: scale(0.96); }

  .splash-note {
    margin-top: 16px;
    font-size: 12px;
    color: var(--brown-light);
    opacity: 0.7;
  }

  #quiz {
    display: none;
    min-height: 100vh;
    padding: 0 0 40px;
    background: var(--cream);
  }

  .quiz-header {
    background: var(--coral);
    padding: 20px 24px 28px;
    position: relative;
    overflow: hidden;
  }

  .quiz-header::after {
    content: '';
    position: absolute;
    bottom: -20px; left: 0; right: 0;
    height: 40px;
    background: var(--cream);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .progress-label {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .progress-text {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    font-weight: 500;
  }

  .progress-bar {
    height: 6px;
    background: rgba(255,255,255,0.25);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: white;
    border-radius: 10px;
    transition: width 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .question-container {
    padding: 32px 20px 20px;
  }

  .question-num {
    font-size: 11px;
    font-weight: 700;
    color: var(--coral);
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .question-text {
    font-size: 19px;
    font-weight: 700;
    color: var(--brown);
    line-height: 1.5;
    margin-bottom: 28px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .option-btn {
    background: white;
    border: 2px solid transparent;
    border-radius: 16px;
    padding: 16px 18px 16px 48px;
    text-align: left;
    cursor: pointer;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 14px;
    color: var(--brown);
    line-height: 1.6;
    transition: all 0.2s;
    box-shadow: 0 2px 8px rgba(92,61,46,0.06);
    position: relative;
    overflow: hidden;
  }

  .option-paw {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    transition: transform 0.3s;
    line-height: 1;
  }

  .option-btn:active { transform: scale(0.98); }

  .option-btn.selected {
    border-color: var(--coral);
    background: var(--coral-pale);
  }

  .option-btn.selected .option-paw {
    transform: translateY(-50%) scale(1.3) rotate(15deg);
  }

  .option-btn:hover {
    border-color: var(--peach);
    background: #FFF8F5;
  }

  @keyframes pawTap {
    0% { transform: translateY(-50%) scale(1); }
    30% { transform: translateY(-50%) scale(1.5) rotate(25deg); }
    70% { transform: translateY(-50%) scale(0.9) rotate(-5deg); }
    100% { transform: translateY(-50%) scale(1.2) rotate(12deg); }
  }

  .option-btn.animating .option-paw {
    animation: pawTap 0.45s ease forwards;
  }

  #result {
    display: none;
    min-height: 100vh;
    padding: 0 0 48px;
  }

  .result-header {
    background: var(--coral);
    padding: 48px 24px 60px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .result-header::before {
    content: '🐾🐾🐾';
    position: absolute;
    top: 16px; right: 16px;
    font-size: 20px;
    opacity: 0.15;
    letter-spacing: 4px;
  }

  .result-header::after {
    content: '';
    position: absolute;
    bottom: -24px; left: 0; right: 0;
    height: 48px;
    background: var(--cream);
    border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  }

  .result-cat-emoji {
    font-size: 80px;
    display: block;
    margin-bottom: 8px;
    animation: resultBounce 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  }

  @keyframes resultBounce {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  .result-type-label {
    color: rgba(255,255,255,0.75);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .result-name {
    color: white;
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 4px;
  }

  .result-breed {
    color: rgba(255,255,255,0.8);
    font-size: 13px;
    font-weight: 500;
  }

  .dim-badges {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .dim-badge {
    background: rgba(255,255,255,0.2);
    color: white;
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.3);
  }

  .result-body {
    padding: 40px 20px 20px;
  }

  .coupon-card {
    background: white;
    border: 2px dashed var(--coral);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    text-align: center;
  }

  .coupon-label {
    font-size: 11px;
    font-weight: 700;
    color: var(--coral);
    letter-spacing: 1px;
    margin-bottom: 10px;
  }

  .coupon-code {
    font-size: 28px;
    font-weight: 900;
    color: var(--brown);
    letter-spacing: 4px;
    margin-bottom: 6px;
    font-family: monospace;
  }

  .coupon-sub {
    font-size: 11px;
    color: var(--brown-light);
    margin-bottom: 6px;
  }

  .coupon-hint {
    font-size: 11px;
    color: var(--brown-light);
    margin-bottom: 16px;
    opacity: 0.8;
  }

  .btn-coupon-copy {
    width: 100%;
    background: var(--coral);
    color: white;
    border: none;
    padding: 13px;
    border-radius: 50px;
    font-size: 14px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .coupon-code {
    font-size: 28px;
    font-weight: 900;
    color: var(--brown);
    letter-spacing: 4px;
    margin-bottom: 6px;
    font-family: monospace;
  }

  .coupon-sub {
    font-size: 11px;
    color: var(--brown-light);
    margin-bottom: 16px;
  }

  .coupon-btns {
    display: flex;
    gap: 10px;
  }

  .btn-coupon-copy:active, .btn-coupon-go:active { transform: scale(0.97); }

  .result-bars {
    background: white;
    border-radius: 20px;
    padding: 18px 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(92,61,46,0.06);
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .bar-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .bar-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    font-weight: 700;
    color: var(--brown-light);
    position: relative;
  }

  .bar-track {
    height: 8px;
    background: #F0E8E0;
    border-radius: 10px;
    overflow: visible;
    position: relative;
    display: flex;
    align-items: center;
  }

  .bar-fill {
    height: 100%;
    border-radius: 10px;
    transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
  }

  .bar-fill.bar-social { background: var(--coral); }
  .bar-fill.bar-social.bar-right { background: var(--coral); }
  .bar-fill.bar-exec { background: var(--sky); }
  .bar-fill.bar-exec.bar-right { background: var(--sky); }
  .bar-fill.bar-vibe { background: var(--orange); }
  .bar-fill.bar-vibe.bar-right { background: var(--orange); }

  .bar-dot {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    background: white;
    border: 3px solid var(--coral);
    border-radius: 50%;
  }

  .bar-exec .bar-dot { border-color: var(--sky); }
  .bar-vibe .bar-dot { border-color: #F5A350; }

  .bar-exec ~ * .bar-value,
  .bar-exec + .bar-value { color: var(--sky); }

  .bar-value {
    font-size: 10px;
    font-weight: 700;
    color: var(--coral);
    text-align: right;
    margin-top: 2px;
  }

  .result-tags-chips {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    margin-bottom: 16px;
    justify-content: center;
    overflow: hidden;
  }

  .chip {
    background: white;
    border: 1.5px solid var(--peach);
    color: var(--brown);
    font-size: 11px;
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 20px;
    white-space: nowrap;
  }

  .chip:nth-child(2),
  .chip:nth-child(4) {
    border-color: var(--sky);
    color: var(--sky);
  }

  .result-desc {
    background: white;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 12px rgba(92,61,46,0.06);
    font-size: 14px;
    color: var(--brown);
    line-height: 1.85;
  }

  .result-tags {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 24px;
  }

  .tag-card {
    background: white;
    border-radius: 16px;
    padding: 16px 18px;
    box-shadow: 0 2px 8px rgba(92,61,46,0.06);
  }

  .tag-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .tag-label.skill { color: var(--coral); }
  .tag-label.enemy { color: #5B8DD9; }

  .tag-item {
    font-size: 14px;
    color: var(--brown);
    line-height: 1.7;
  }

  .btn-download {
    width: 100%;
    background: white;
    border: 2px solid var(--coral);
    color: var(--coral);
    padding: 15px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 12px;
  }

  .btn-share {
    width: 100%;
    background: var(--coral);
    color: white;
    border: none;
    padding: 15px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(232,82,74,0.3);
    transition: all 0.2s;
    margin-bottom: 12px;
  }

  .btn-retry {
    width: 100%;
    background: white;
    border: 2px solid var(--coral);
    color: var(--coral);
    padding: 15px;
    border-radius: 50px;
    font-size: 15px;
    font-weight: 700;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }

  .screen { animation: fadeIn 0.4s ease both; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .btn-back {
    display: inline-block;
    background: none;
    border: 1.5px solid var(--brown-light);
    color: var(--brown-light);
    font-size: 12px;
    font-family: 'Noto Sans TC', sans-serif;
    cursor: pointer;
    padding: 5px 14px;
    border-radius: 50px;
    opacity: 0.6;
    transition: opacity 0.2s;
    margin-bottom: 12px;
  }
  .btn-back:active { opacity: 1; }

  .question-slide {
    animation: slideIn 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(30px); }
    to { opacity: 1; transform: translateX(0); }
  }
</style>
</head>
<body>

<div id="splash" class="screen">
  <div class="splash-cat">🐱</div>
  <div class="splash-badge">人格測驗</div>
  <h1 class="splash-title">喵咪<span>TI</span></h1>
  <p class="splash-sub">7 道題，找出你到底是哪種貓的靈魂附體</p>
  <button class="btn-start" onclick="startQuiz()">開始測驗 🐾</button>
  <p class="splash-note">約 2 分鐘完成</p>
</div>

<div id="quiz">
  <div class="quiz-header">
    <div class="progress-label">
      <span class="progress-text" id="progressText">第 1 題，共 7 題</span>
      <span style="font-size:18px">🐾</span>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
  </div>
  <div class="question-container" id="questionContainer"></div>
</div>

<div id="result"></div>

<script>
const questions = [
  {
    id: 1,
    text: '在一個沒什麼熟人的場合，要你自己找人搭檔，你？',
    options: [
      { paw: '🐾', text: '眼神掃過全場，在三秒內鎖定目標，自然飄移過去', value: 'E' },
      { paw: '🐾', text: '希望有人來找自己，沒有的話⋯⋯等有人說「那我們一組？」就好', value: 'I' },
      { paw: '🐾', text: '跟旁邊的人對到眼，尷尬地說「那我們一組？」然後不知道接下來要說什麼', value: 'M_EI' }
    ]
  },
  {
    id: 2,
    text: '朋友說週末要辦聚會，你？',
    options: [
      { paw: '🐾', text: '「好啊在哪我帶東西去」，然後開始規劃要帶什麼', value: 'E' },
      { paw: '🐾', text: '「有誰？幾個人？在哪？」問完才決定去不去', value: 'I' },
      { paw: '🐾', text: '「那天可能有事」，傳完繼續躺著', value: 'I' }
    ]
  },
  {
    id: 3,
    text: '對方已讀你的訊息三小時了，你？',
    options: [
      { paw: '🐾', text: '再傳一則「?」，不是在生氣，只是在追進度', value: 'EJ' },
      { paw: '🐾', text: '算了，自己做，反正等他還不如直接完成', value: 'IJ' },
      { paw: '🐾', text: '盯著那個已讀符號看了很久，決定去睡覺，明天的事明天說', value: 'IT' }
    ]
  },
  {
    id: 4,
    text: 'Deadline 是明天 11:59，現在是今天下午兩點，你在幹嘛？',
    options: [
      { paw: '🐾', text: '已經寫完了，在調字距，這樣比較不焦慮', value: 'JA' },
      { paw: '🐾', text: '剛開新文件，打了標題，去泡了杯咖啡，準備進入高效模式（還沒進入）', value: 'P' },
      { paw: '🐾', text: '開著文件但在滑手機，每隔一段時間看一下字數，假裝這樣就算在趕進度', value: 'M_JP' }
    ]
  },
  {
    id: 5,
    text: '深夜十二點，東西做到一半，電腦當機，沒存檔。你的反應？',
    options: [
      { paw: '🐾', text: '「好。」重新打開，從頭來，這次寫得更快，因為已經想清楚了', value: 'JA' },
      { paw: '🐾', text: '盯著黑屏五秒，進入詭異的平靜——超過崩潰閾值就不崩潰了', value: 'PT' },
      { paw: '🐾', text: '關機，睡覺，明天再說，反正也不知道剛才寫了什麼', value: 'M_PA' }
    ]
  },
  {
    id: 6,
    text: '你的房間狀態最接近哪種？',
    options: [
      { paw: '🐾', text: '東西都有固定的位置，不然會不舒服', value: 'A' },
      { paw: '🐾', text: '看起來很亂，但自己知道每樣東西在哪，這叫「有機系統」', value: 'T' },
      { paw: '🐾', text: '每次都說下次一定會整理，但沒有下次', value: 'T' }
    ]
  },
  {
    id: 7,
    text: '朋友說你的想法「太理想化了」，你？',
    options: [
      { paw: '🐾', text: '「嗯。」然後繼續做，不需要他理解', value: 'A' },
      { paw: '🐾', text: '「哈也是啦⋯⋯」回家之後才想到要反駁什麼，對著牆壁說了一遍', value: 'T' },
      { paw: '🐾', text: '當下同意了，但莫名地有點不服氣，自己也說不清楚為什麼', value: 'M_AT' }
    ]
  }
];

const results = {
  'EJA': {
    name: '學術獵豹', breed: '孟加拉貓', emoji: '🐆', img: 'https://res.cloudinary.com/dtnclzajp/image/upload/e_background_removal/v1778729490/%E5%AD%9F%E5%8A%A0%E6%8B%89_qt0qom.png',
    dims: ['外向', '計畫型', '霸總'],
    bars: [
      { left: '外向', right: '內向', value: 90 },
      { left: '計畫', right: '應激', value: 90 },
      { left: '霸總', right: '隨興', value: 80 }
    ],

let scores = { E:0, I:0, J:0, P:0, A:0, T:0 };
let currentQ = 0;
let locked = false;
let history = []; // { value, scoreDelta }

function startQuiz() {
  document.getElementById('splash').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}

function getScoreDelta(value) {
  const d = { E:0, I:0, J:0, P:0, A:0, T:0 };
  if (value === 'E') d.E=1;
  else if (value === 'I') d.I=1;
  else if (value === 'EJ') { d.E=1; d.J=1; }
  else if (value === 'IJ') { d.I=1; d.J=1; }
  else if (value === 'IP') { d.I=1; d.P=1; }
  else if (value === 'J') d.J=1;
  else if (value === 'P') d.P=1;
  else if (value === 'JA') { d.J=1; d.A=1; }
  else if (value === 'PT') { d.P=1; d.T=1; }
  else if (value === 'A') d.A=1;
  else if (value === 'T') d.T=1;
  else if (value === 'IT') { d.I=1; d.T=1; }
  else if (value === 'M_EI') { d.E=0.5; d.I=0.5; }
  else if (value === 'M_JP') { d.J=0.5; d.P=0.5; }
  else if (value === 'M_PA') { d.P=0.5; d.A=0.5; }
  return d;
}

function renderQuestion() {
  locked = false;
  const q = questions[currentQ];
  const pct = (currentQ / questions.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `第 ${currentQ + 1} 題，共 ${questions.length} 題`;

  const backBtn = currentQ > 0
    ? `<button class="btn-back" onclick="goBack()">← 上一題</button>`
    : ``;

  const container = document.getElementById('questionContainer');
  container.innerHTML = `
    ${backBtn}
    <div class="question-slide">
      <div class="question-num" style="margin-top:12px">Q${q.id} / 7</div>
      <div class="question-text">${q.text}</div>
      <div class="options">
        ${q.options.map((opt, i) => `
          <button class="option-btn" onclick="selectOption(this, '${opt.value}')">
            <span class="option-paw">${opt.paw}</span>
            ${opt.text}
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

function selectOption(btn, value) {
  if (locked) return;
  locked = true;

  btn.classList.add('selected', 'animating');

  const delta = getScoreDelta(value);
  Object.keys(delta).forEach(k => scores[k] += delta[k]);
  history.push({ value, delta });

  setTimeout(() => {
    currentQ++;
    if (currentQ >= questions.length) showResult();
    else renderQuestion();
  }, 520);
}

function goBack() {
  if (currentQ <= 0) return;
  const last = history.pop();
  Object.keys(last.delta).forEach(k => scores[k] -= last.delta[k]);
  currentQ--;
  renderQuestion();
}

function showResult() {
  const social = scores.E > scores.I ? 'E' : scores.I > scores.E ? 'I' : (Math.random() > 0.5 ? 'E' : 'I');

  const vibe   = scores.A > scores.T ? 'A' : scores.T > scores.A ? 'T' : (Math.random() > 0.5 ? 'A' : 'T');
  const key = social + exec + vibe;
  const r = results[key] || results['IPT'];

function downloadCard() {
  const key = (scores.E > scores.I ? 'E' : 'I') +
              (scores.J > scores.P ? 'J' : 'P') +
              (scores.A > scores.T ? 'A' : 'T');
  const r = results[key] || results['IPT'];
  const W = 600;
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = 900;
  const ctx = canvas.getContext('2d');

  ctx.fillStyle = '#FDF6F0';
  ctx.fillRect(0, 0, W, 900);

  const redH = 280;
  ctx.fillStyle = '#E8524A';
  ctx.fillRect(0, 0, W, redH);

  ctx.font = '86px serif'; ctx.textAlign = 'center';
  ctx.fillText(r.emoji, W/2, 96);

  ctx.font = '400 17px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.fillText('你是', W/2, 130);

  ctx.font = '900 50px sans-serif'; ctx.fillStyle = '#FFFFFF';
  ctx.fillText(r.name, W/2, 190);

  ctx.font = '400 20px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText(r.breed, W/2, 224);

  ctx.font = '700 15px sans-serif';
  const bPad = 11, bH = 26, bGap = 7;
  const bWidths = r.dims.map(d => ctx.measureText(d).width + bPad * 2);
  const bTotal = bWidths.reduce((a,b)=>a+b,0) + (r.dims.length-1)*bGap;
  let bx = (W - bTotal) / 2;
  r.dims.forEach((dim, i) => {
    const bw = bWidths[i];
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    roundRect(ctx, bx, 246, bw, bH, 13); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    roundRect(ctx, bx, 246, bw, bH, 13); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.textAlign = 'left';
    ctx.fillText(dim, bx + bPad, 263);
    bx += bw + bGap;
  });

  ctx.font = '700 16px sans-serif';
  const tPad = 12, tH = 29, tGap = 6;
  const tWidths = r.tags.map(t => ctx.measureText(t).width + tPad * 2);
  const tTotal = tWidths.reduce((a,b)=>a+b,0) + (r.tags.length-1)*tGap;
  let tx = (W - tTotal) / 2;
  const tagY = redH + 20;
  r.tags.forEach((tag, i) => {
    const tw = tWidths[i];
    ctx.fillStyle = i % 2 === 0 ? '#FDECEA' : '#EDF6FB';
    roundRect(ctx, tx, tagY, tw, tH, 14); ctx.fill();
    ctx.fillStyle = i % 2 === 0 ? '#E8524A' : '#6BB8D4';
    ctx.textAlign = 'left';
    ctx.fillText(tag, tx + tPad, tagY + 19);
    tx += tw + tGap;
  });

  const boxX = 40, boxY = tagY + tH + 20, boxW = W - 80;
  ctx.font = '400 18px sans-serif';
  const desc = r.desc.split('\n\n')[0];
  const maxLW = boxW - 56;
  const lines = [];
  let line = '';
  for (const ch of desc) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxLW && line !== '') {
      lines.push(line); line = ch;
    } else line = test;
  }
  lines.push(line);
  const lH = 30;
  const boxH = lines.length * lH + 52;

  ctx.strokeStyle = '#EDE0D4'; ctx.lineWidth = 1.5;
  roundRect(ctx, boxX, boxY, boxW, boxH, 16); ctx.stroke();

  ctx.font = '800 42px serif'; ctx.fillStyle = '#E8524A';
  ctx.globalAlpha = 0.2; ctx.textAlign = 'left';
  ctx.fillText('\u201C', boxX + 12, boxY + 38);
  ctx.textAlign = 'right';
  ctx.fillText('\u201D', boxX + boxW - 12, boxY + boxH - 4);
  ctx.globalAlpha = 1;

  const midX = W / 2, dY = boxY + 18;
  ctx.strokeStyle = '#EDE0D4'; ctx.lineWidth = 1; ctx.globalAlpha = 0.8;
  ctx.beginPath(); ctx.moveTo(boxX + 40, dY); ctx.lineTo(midX - 8, dY); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(midX + 8, dY); ctx.lineTo(boxX + boxW - 40, dY); ctx.stroke();
  ctx.strokeStyle = '#E8524A'; ctx.globalAlpha = 0.4;
  ctx.beginPath();
  ctx.moveTo(midX, dY-5); ctx.lineTo(midX+6, dY); ctx.lineTo(midX, dY+5); ctx.lineTo(midX-6, dY);
  ctx.closePath(); ctx.stroke();
  ctx.globalAlpha = 1;

  ctx.font = '400 18px sans-serif'; ctx.fillStyle = '#5C3D2E'; ctx.textAlign = 'center';
  lines.forEach((l, i) => ctx.fillText(l, W/2, boxY + 42 + i * lH));

  const footY = boxY + boxH + 20;
  ctx.strokeStyle = '#EDE0D4'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(boxX, footY); ctx.lineTo(boxX + boxW, footY); ctx.stroke();

  ctx.font = '20px serif'; ctx.textAlign = 'center';
  ctx.fillText('\uD83D\uDC3E', W/2, footY + 28);

  ctx.font = '400 16px sans-serif'; ctx.fillStyle = '#B09080';
  ctx.fillText('cat-mauve-eight.vercel.app', W/2, footY + 50);

  const finalH = footY + 66;
  const finalCanvas = document.createElement('canvas');
  finalCanvas.width = W; finalCanvas.height = finalH;
  finalCanvas.getContext('2d').drawImage(canvas, 0, 0);

  const link = document.createElement('a');
  link.download = `喵咪TI_${r.name}.png`;
  link.href = finalCanvas.toDataURL('image/png');
  link.click();
}


function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function wrapText(ctx, text, x, y, maxW, lineH) {
  const words = text.split('');
  let line = '';
  let cy = y;
  for (let i = 0; i < words.length; i++) {
    const test = line + words[i];
    if (ctx.measureText(test).width > maxW && line !== '') {
      ctx.fillText(line, x, cy);
      line = words[i];
      cy += lineH;
    } else {
      line = test;
    }
  }
  ctx.fillText(line, x, cy);
}

function shareResult(name, breed) {
  const text = `我做了喵咪TI測驗，結果是「${name}」（${breed}）🐾\n你是哪種貓？`;
  const url = window.location.href;
  const full = text + '\n' + url;

  if (navigator.share) {
    navigator.share({ title: '喵咪TI', text, url }).catch(() => showShareModal(full));
  } else {
    showShareModal(full);
  }
}

function showShareModal(content) {
  const existing = document.getElementById('shareModal');
  if (existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'shareModal';
  modal.style.cssText = `
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    display: flex; align-items: flex-end; justify-content: center;
    z-index: 999; padding: 16px;
  `;
  modal.innerHTML = `
    <div style="background:white;border-radius:24px;padding:24px;width:100%;max-width:480px;box-shadow:0 8px 32px rgba(0,0,0,0.2)">
      <div style="font-size:14px;font-weight:700;color:#5C3D2E;margin-bottom:12px">分享給朋友 🐾</div>
      <textarea readonly style="width:100%;height:90px;border:1.5px solid #F5C5A3;border-radius:12px;padding:12px;font-size:13px;color:#5C3D2E;font-family:'Noto Sans TC',sans-serif;resize:none;outline:none;background:#FDF6F0">${content}</textarea>
      <div style="display:flex;gap:10px;margin-top:12px">
        <button onclick="doCopy(this)" style="flex:1;background:#E8524A;color:white;border:none;padding:13px;border-radius:50px;font-size:14px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer">複製內容</button>
        <button onclick="document.getElementById('shareModal').remove()" style="flex:1;background:white;color:#8B6355;border:2px solid #F5C5A3;padding:13px;border-radius:50px;font-size:14px;font-weight:700;font-family:'Noto Sans TC',sans-serif;cursor:pointer">關閉</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

function doCopy(btn) {
  const ta = btn.closest('div').previousElementSibling;
  navigator.clipboard.writeText(ta.value).then(() => {
    btn.textContent = '已複製 ✓';
    btn.style.background = '#4CAF50';
    setTimeout(() => {
      btn.textContent = '複製內容';
      btn.style.background = '#E8524A';
    }, 2000);
  }).catch(() => {
    ta.select();
    document.execCommand('copy');
    btn.textContent = '已複製 ✓';
  });
}

function retryQuiz() {
  scores = { E:0, I:0, J:0, P:0, A:0, T:0 };
  currentQ = 0;
  locked = false;
  history = [];
  document.getElementById('result').style.display = 'none';
  document.getElementById('quiz').style.display = 'block';
  renderQuestion();
}
